# nf-core/fetchngs 1.12.0 — LMO pilot (3 dates, all three omics layers)
#
# REQUIRES: export NXF_SYNTAX_PARSER=v1
# Nextflow 26.04+ defaults to the strict (v2) config parser, which rejects the
# `def check_max(obj, type)` helper in this pipeline's nextflow.config. 1.12.0 is the
# latest release and predates the nf-core 3.x template, so the legacy parser is required.
#
# Paths are absolute for the EBI codon cluster — change if the checkout moves.

input: "/path/to/runs/01_fetchngs/ids.csv"
outdir: "/path/to/sig/fetchngs"

# 'ftp' needs no extra tooling and is fine at this volume (~35 GB).
# Switch to 'aspera' if `ascp` is on PATH — roughly 3-5x faster for the full 404 GB run.
download_method: "ftp"

# IMPORTANT: this REPLACES fetchngs' built-in field list rather than extending it.
# The built-in list omits `collection_date`, and LMO's `sample_alias` dates are stale
# (see AGENTS.md, LMO-specific handling). Every field below the blank-line comment is
# the fetchngs default; `collection_date` and the environmental fields are our additions.
ena_metadata_fields: >-
  run_accession,experiment_accession,sample_accession,secondary_sample_accession,
  study_accession,secondary_study_accession,submission_accession,
  run_alias,experiment_alias,sample_alias,study_alias,
  library_layout,library_selection,library_source,library_strategy,library_name,
  instrument_model,instrument_platform,base_count,read_count,
  tax_id,scientific_name,sample_title,experiment_title,study_title,sample_description,
  fastq_md5,fastq_bytes,fastq_ftp,fastq_galaxy,fastq_aspera,
  collection_date,lat,lon,depth,environmental_medium

# Columns carried into id_mappings.csv / multiqc_config.yml.
# collection_date is the join key for every downstream samplesheet — sample_alias is not.
sample_mapping_fields: "run_accession,experiment_accession,sample_accession,sample_alias,sample_title,collection_date,library_strategy,instrument_model"

# NOT SET: nf_core_pipeline.
# Its enum is [rnaseq, atacseq, viralrecon, taxprofiler] only — there is no ampliseq,
# mag or metatdenovo option, and a single mixed samplesheet across three library
# strategies would be wrong anyway. The generic samplesheet.csv is split per layer
# downstream. To probe the taxprofiler handoff, rerun metadata-only:
#   --nf_core_pipeline taxprofiler --skip_fastq_download
