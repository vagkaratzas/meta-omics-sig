# nf-core/proteinfamilies 2.4.0 — LMO pilot, families from metatranscriptome ORFs
#
# Build the samplesheet first (one row, absolute path, so not committed):
#
#   python3 scripts/converters/metatdenovo_to_proteinfamilies.py \
#       <metatdenovo-outdir> runs/03_proteinfamilies/samplesheet.csv
#
# Modern nf-core template. Requires Nextflow >= 25.10.4; no NXF_SYNTAX_PARSER needed.

input: "/path/to/runs/03_proteinfamilies/samplesheet.csv"
outdir: "/path/to/results/03_proteinfamilies"

# Defaults are kept deliberately. This run's purpose is to prove the
# metatdenovo -> proteinfamilies handoff, not to tune clustering, so the only reason to
# set anything here is if the defaults fail on real input. Values that will matter once
# results are interpreted, recorded so the choice is explicit rather than accidental:
#
#   clustering_tool             cluster        (mmseqs; use 'linclust' for very large sets)
#   cluster_seq_identity        0.3
#   cluster_coverage            0.5
#   cluster_size_threshold      25             minimum cluster size to seed an MSA
#   min_seq_length / max_seq_length  30 / 5000 prodigal ORFs shorter than 30 aa are dropped
#
# Prodigal on a metatranscriptome co-assembly produces many short partial ORFs, so expect
# min_seq_length to remove a visible fraction. Record how many before interpreting family
# counts.
